[package]
name = "doc-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
description = "The doc backend in Rust: the same HTTP API, WebSocket collaboration and database as src/server"

[[bin]]
name = "doc-server"
path = "src/main.rs"

[lib]
name = "doc_server"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
socket2 = "0.6"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
http-body = "1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
postgres-types = "0.2"
postgres-protocol = "0.6"
fallible-iterator = "0.2"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth", "float_roundtrip"] }
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = "2"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
flate2 = "1"
regex = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
percent-encoding = "2"
url = "2"
hostname = "0.4"
