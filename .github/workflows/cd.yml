name: CD

# Publishes the image and triggers the deploy hook once CI has passed on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# An in-progress deploy is never cut off; a newer one waits for it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  docker-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      # CI runs can finish out of order; whichever run fires, only main's tip
      # is built, and only once its CI has passed.
      - name: Resolve main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          deploy=
          if [ "$sha" = "$RUN_SHA" ]; then
            deploy=1
          else
            # A newer CD run may have cancelled the tip's own pending run, so
            # deploy the tip here when its CI has already passed.
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq .total_count)
            if [ "$passed" -gt 0 ]; then
              deploy=1
            else
              echo "CI passed for ${RUN_SHA:0:7}, but main is at ${sha:0:7}, which has not passed CI yet; its own run deploys it."
            fi
          fi
          if [ -n "$deploy" ]; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tip.outputs.sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.tip.outputs.sha }}
          persist-credentials: false

      - if: steps.tip.outputs.sha != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.tip.outputs.sha != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - if: steps.tip.outputs.sha != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/doc:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/doc:sha-${{ steps.tip.outputs.short }}

  deploy:
    needs: docker-push
    if: needs.docker-push.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger deploy
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SHA: ${{ needs.docker-push.outputs.sha }}
        run: |
          # Only the status is printed: the URL and the response stay out of public logs.
          status=$(curl -s -o /dev/null --max-time 60 -w '%{http_code}' -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"sha\":\"${SHA}\",\"repo\":\"${GITHUB_REPOSITORY}\"}") || status=000
          echo "deploy hook answered $status"
          case "$status" in 2??) ;; *) exit 1 ;; esac
